<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Lineage Marshal is an autonomous incident-investigation agent for data pipelines. It walks DataHub lineage, scores blast radius, resolves owners, notifies them, and writes every investigation back to the catalog so knowledge compounds."
    />
    <title>Lineage Marshal — Incident investigation agent for data pipelines</title>

    <!-- Link previews (GitHub, Slack, social). Kept in sync with the hero copy. -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Lineage Marshal — Incident investigation agent for data pipelines"
    />
    <meta
      property="og:description"
      content="When a pipeline breaks, the investigation has already started. Blast radius scoring, ownership resolution and knowledge that compounds — built on DataHub."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Applied before first paint so the themed background never flashes.
      try {
        var t = localStorage.getItem('lm.theme');
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark'
            ? t
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
